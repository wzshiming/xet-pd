name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install 'huggingface_hub[hf_xet]==2.2.0' 'hf_xet==1.7.0'
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go mod tidy -diff
      - run: go test -race -count=1 -v -timeout 15m ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Three kind nodes exhaust the runner's default inotify limits.
      - run: sudo sysctl -w fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288
      - run: |
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: go test -count=1 -v -timeout 25m ./e2e/kind
        env:
          XET_PD_E2E_KIND: "1"
          # Kept for the log export below; the runner is discarded anyway.
          XET_PD_E2E_KIND_KEEP: "1"
      - if: failure()
        run: kind export logs --name xet-pd-e2e kind-logs
        # There is no cluster when the test failed before creating it.
        continue-on-error: true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-logs
          path: kind-logs
          if-no-files-found: ignore
