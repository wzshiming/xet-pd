# Local test cluster: one tracker, access peer peer-1, which alone reaches the hub, and internal peer peer-2.
# Peers advertise their service names, so hub clients join this network and use HF_ENDPOINT=http://peer-1:8081.
name: xet-pd-cluster

x-app: &app
  restart: unless-stopped
  stop_grace_period: 15s

x-peer: &peer
  build:
    context: .
    target: peer
  image: xet-pd-peer:local

x-secret: &secret
  XET_PD_SECRET: ${XET_PD_SECRET:-xet-pd-local-test}

x-healthcheck: &healthcheck
  interval: 2s
  timeout: 2s
  start_period: 5s
  retries: 30

services:
  tracker:
    <<: *app
    build:
      context: .
      target: tracker
    image: xet-pd-tracker:local
    command:
      - -listen=:8080
      - -replicas=2
      - -min-seeds=1
      - -peer-ttl=10s
    environment: *secret
    ports:
      - 8080:8080
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O-, "http://127.0.0.1:8080/healthz"]

  peer-1:
    <<: [*app, *peer]
    command:
      - -listen=:8081
      - -advertise=http://peer-1:8081
      - -tracker=http://tracker:8080
      - -upstream=${HF_ENDPOINT:-https://huggingface.co}
      - -heartbeat=1s
      - -data-dir=/data
      - -xorb-cache-size=1GiB
    environment:
      <<: *secret
      HF_TOKEN: ${HF_TOKEN:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      tracker:
        condition: service_healthy
    ports:
      - 8081:8081
    volumes:
      - peer-1-data:/data
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O-, "http://127.0.0.1:8081/healthz"]

  peer-2:
    <<: [*app, *peer]
    command:
      - -listen=:8081
      - -advertise=http://peer-2:8081
      - -tracker=http://tracker:8080
      - -heartbeat=1s
      - -data-dir=/data
      - -xorb-cache-size=1GiB
    environment: *secret
    depends_on:
      tracker:
        condition: service_healthy
    ports:
      - 8082:8081
    volumes:
      - peer-2-data:/data
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O-, "http://127.0.0.1:8081/healthz"]

volumes:
  peer-1-data:
  peer-2-data:
