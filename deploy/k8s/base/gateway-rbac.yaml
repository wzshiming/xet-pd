apiVersion: v1
kind: ServiceAccount
metadata:
  name: xet-pd-gateway
  namespace: xet-pd
  labels:
    app.kubernetes.io/name: xet-pd-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: xet-pd
---
# Cluster-wide: clients in any namespace are matched to their node through their pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xet-pd-gateway
  labels:
    app.kubernetes.io/name: xet-pd-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: xet-pd
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xet-pd-gateway
  labels:
    app.kubernetes.io/name: xet-pd-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: xet-pd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xet-pd-gateway
subjects:
  - kind: ServiceAccount
    name: xet-pd-gateway
    namespace: xet-pd
