apiVersion: apps/v1
kind: Deployment
metadata:
  name: xet-pd-tracker
  namespace: xet-pd
  labels:
    app.kubernetes.io/name: xet-pd-tracker
    app.kubernetes.io/component: tracker
    app.kubernetes.io/part-of: xet-pd
spec:
  # Stateless: peers re-announce to a new tracker on their next heartbeat.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xet-pd-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xet-pd-tracker
        app.kubernetes.io/component: tracker
        app.kubernetes.io/part-of: xet-pd
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tracker
          image: ghcr.io/wzshiming/xet-pd-tracker:master
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: XET_PD_LOG_FORMAT
              value: json
            - name: XET_PD_SECRET
              valueFrom:
                secretKeyRef:
                  name: xet-pd-secret
                  key: XET_PD_SECRET
            # - name: XET_PD_PEER_TTL
            #   value: 30s
            # - name: XET_PD_REPLICAS
            #   value: "2"
            # - name: XET_PD_MIN_SEEDS
            #   value: "1"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
