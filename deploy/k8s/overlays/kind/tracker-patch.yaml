apiVersion: apps/v1
kind: Deployment
metadata:
  name: xet-pd-tracker
  namespace: xet-pd
spec:
  template:
    spec:
      containers:
        - name: tracker
          imagePullPolicy: Never
          env:
            - name: XET_PD_PEER_TTL
              value: 10s
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
